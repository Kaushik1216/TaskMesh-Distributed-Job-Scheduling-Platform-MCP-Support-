spring:
  application:
    name: taskmesh-worker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmesh}
    username: ${SPRING_DATASOURCE_USERNAME:taskmesh}
    password: ${SPRING_DATASOURCE_PASSWORD:taskmesh}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8083}

taskmesh:
  worker:
    id: ${WORKER_ID:worker-1}
    capabilities: ${WORKER_CAPABILITIES:RUN_COMMAND,TEST_EXECUTION}
    max-concurrency: ${WORKER_MAX_CONCURRENCY:4}
  api:
    base-url: ${TASKMESH_API_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.taskmesh: DEBUG
    org.springframework.kafka: INFO
