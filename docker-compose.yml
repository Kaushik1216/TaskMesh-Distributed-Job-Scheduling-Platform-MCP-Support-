version: '3.8'

networks:
  taskmesh-network:
    driver: bridge

services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: taskmesh-postgres
    environment:
      POSTGRES_DB: taskmesh
      POSTGRES_USER: taskmesh
      POSTGRES_PASSWORD: taskmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmesh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [taskmesh-network]

  redis:
    image: redis:7-alpine
    container_name: taskmesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [taskmesh-network]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: taskmesh-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [taskmesh-network]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: taskmesh-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [taskmesh-network]

  # ─── Application Services ──────────────────────────────────────────────────

  taskmesh-api:
    build: ./taskmesh-api
    container_name: taskmesh-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmesh
      SPRING_DATASOURCE_USERNAME: taskmesh
      SPRING_DATASOURCE_PASSWORD: taskmesh
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_started }
    networks: [taskmesh-network]

  taskmesh-scheduler-1:
    build: ./taskmesh-scheduler
    container_name: taskmesh-scheduler-1
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmesh
      SPRING_DATASOURCE_USERNAME: taskmesh
      SPRING_DATASOURCE_PASSWORD: taskmesh
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      INSTANCE_ID: scheduler-1
      SERVER_PORT: "8081"
    depends_on: [taskmesh-api]
    networks: [taskmesh-network]

  taskmesh-scheduler-2:
    build: ./taskmesh-scheduler
    container_name: taskmesh-scheduler-2
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmesh
      SPRING_DATASOURCE_USERNAME: taskmesh
      SPRING_DATASOURCE_PASSWORD: taskmesh
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      INSTANCE_ID: scheduler-2
      SERVER_PORT: "8082"
    depends_on: [taskmesh-api]
    networks: [taskmesh-network]

  taskmesh-worker-1:
    build: ./taskmesh-worker
    container_name: taskmesh-worker-1
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmesh
      SPRING_DATASOURCE_USERNAME: taskmesh
      SPRING_DATASOURCE_PASSWORD: taskmesh
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      WORKER_ID: worker-1
      WORKER_CAPABILITIES: RUN_COMMAND,BUILD_PROJECT
      WORKER_MAX_CONCURRENCY: "4"
      TASKMESH_API_BASE_URL: http://taskmesh-api:8080
      SERVER_PORT: "8083"
    depends_on: [taskmesh-api]
    networks: [taskmesh-network]

  taskmesh-worker-2:
    build: ./taskmesh-worker
    container_name: taskmesh-worker-2
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmesh
      SPRING_DATASOURCE_USERNAME: taskmesh
      SPRING_DATASOURCE_PASSWORD: taskmesh
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      WORKER_ID: worker-2
      WORKER_CAPABILITIES: TEST_EXECUTION,FILE_PROCESSING,DATA_PROCESSING
      WORKER_MAX_CONCURRENCY: "8"
      TASKMESH_API_BASE_URL: http://taskmesh-api:8080
      SERVER_PORT: "8084"
    depends_on: [taskmesh-api]
    networks: [taskmesh-network]

  taskmesh-worker-3:
    build: ./taskmesh-worker
    container_name: taskmesh-worker-3
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmesh
      SPRING_DATASOURCE_USERNAME: taskmesh
      SPRING_DATASOURCE_PASSWORD: taskmesh
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      WORKER_ID: worker-3
      WORKER_CAPABILITIES: RUN_COMMAND,TEST_EXECUTION,HTTP_REQUEST,SEND_NOTIFICATION
      WORKER_MAX_CONCURRENCY: "2"
      TASKMESH_API_BASE_URL: http://taskmesh-api:8080
      SERVER_PORT: "8085"
    depends_on: [taskmesh-api]
    networks: [taskmesh-network]

  taskmesh-mcp:
    build: ./taskmesh-mcp
    container_name: taskmesh-mcp
    ports:
      - "8090:8090"
    environment:
      TASKMESH_API_BASE_URL: http://taskmesh-api:8080
      SERVER_PORT: "8090"
    depends_on: [taskmesh-api]
    networks: [taskmesh-network]

  taskmesh-dashboard:
    build: ./taskmesh-dashboard
    container_name: taskmesh-dashboard
    ports:
      - "3001:80"
    depends_on:
      - taskmesh-api
    networks: [taskmesh-network]

  # ─── Observability ─────────────────────────────────────────────────────────


  prometheus:
    image: prom/prometheus:latest
    container_name: taskmesh-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [taskmesh-network]

  grafana:
    image: grafana/grafana:latest
    container_name: taskmesh-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [taskmesh-network]

volumes:
  postgres-data:
  grafana-data:
